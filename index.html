<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Check lista pendências estágio</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">
            <div id="title">
                <h2>Checklist de Documentação</h2>
                <div style="display: flex; flex-direction: row; justify-content: space-between;">

                    <button id="toggle-drag" class="btn-drag">
                        <svg class="icon" height="24px" viewBox="0 -960 960 960" width="24px">       
                            <path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/> 
                        </svg>
                    </button>

                    <button id="clear-drag" class="btn-drag">
                        <svg class="icon" height="24px" viewBox="0 -960 960 960" width="24px">       
                            <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
                        </svg>
                    </button>

                    <label for="settings" class="icon_container">
                        <input type="checkbox" id="settings" class="settings_input" hidden>
                        <svg class="icon" height="24px" viewBox="0 -960 960 960" width="24px">
                            <path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/>
                        </svg>
                    </label>
                    
                </div>
                
            </div>

            <div id="items">

            </div>

            <hr>

            <div id="assinatura-container">
                <form >
                    <label for="input-setor" class="section-title">Setor de destino:</label>
                    <input id="input-setor" class="inputs" type="text">
                </form>

                <form>
                    <label for="input-nome" class="section-title">Assinatura:</label>
                    <input id="input-nome" class="inputs" type="text">
                </form>
                
            </div>
            
            <button id="GenerateButton">Gerar Texto e Copiar para o SEI</button>
            <p class="nota">O texto será copiado com links e formatação para o editor do SEI, apenas colar na informação</p>
        </div>

<!--------------------------------------------------------------------------------------------------------------------------------------------------------------------->

        <div class="settings_container">

            <div id="title">
                <h2>Configurações</h2>
                <label for="settings" class="icon_container">
                    <input type="checkbox" id="settings" class="settings_input" hidden>
                    <svg class="icon" height="24px" viewBox="0 -960 960 960" width="24px">
                        <path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/>
                    </svg>
                </label>
                
                
            </div>
            
            <div class="setting">
                    <label for="temas">Tema:</label>
                    <select name="temas" id="temas">
                        <option value="default">Claro</option>
                        <option value="dark">Escuro</option>
                        <option value="pink">Erlacher</option>
                        <option value="dracula">Drácula</option>
                        <option value="jungle">Selva</option>
                        <option value="terracota">Terracota</option>
                        <option value="ocean">Oceano</option>
                    </select>
            </div>

            <div class="setting">
                    <label for="bold">Negrito:</label>
                    <select name="bold" id="bold">
                        <option value="true">Ativado</option>
                        <option value="false">Desativado</option>
                    </select>
            </div>

            <div class="setting">
                    <label for="spacing">Espaço entre as pendências:</label>
                    <select name="spacing" id="spacing">
                        <option value="true">Ativado</option>
                        <option value="false">Desativado</option>
                    </select>
            </div>

            <div class="setting">
                    <label for="cor">Cor do marcador:</label>
                    <select name="cor" id="cor">
                        <option value="vermelho">Vermelho</option>
                        <option value="amarelo">Amarelo</option>
                        <option value="rosa">Rosa</option>
                        <option value="custom">Customizado</option>
                    </select>
            </div>
            

            <label for=""></label>

            <button class="save" onclick="save(document.querySelector('#temas').value, document.querySelector('#bold').value, document.querySelector('#spacing').value, document.querySelector('#cor').value)">salvar</button>

        </div>
        <script src="Global.js"></script>
        <script src="Script.js"></script>
        <script src="Darkmode.js"></script>
        
    </body>
</html>
